[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "joint-sensor-simulator"
version = "0.1.0"
description = "Deterministic Dash multi-sensor scenario simulator"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3",
  "pydantic>=2.9,<3",
  "pyproj>=3.7,<4",
  "requests>=2.32,<3",
  "dash>=2.18,<4",
  "dash-leaflet>=1.0.15,<2",
]

[tool.setuptools.packages.find]
include = ["simulator*"]
