[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "civil-hazard-forecast"
version = "0.1.0"
description = "Deterministic civil-infrastructure danger corridor forecasting"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3",
  "pydantic>=2.9,<3",
  "pyproj>=3.7,<4",
  "requests>=2.32,<3",
  "shapely>=2.0,<3",
]

[project.scripts]
hazard-forecast = "hazard_forecast.cli:main"

[tool.setuptools.packages.find]
include = ["hazard_forecast*"]
